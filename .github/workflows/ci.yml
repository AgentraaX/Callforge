name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # chatterbox-tts -> pkuseg==0.0.25 ships only a source dist on Linux,
        # with a legacy setup.py that does `import numpy` at its own
        # build-metadata step - pip's isolated build env doesn't have numpy,
        # so a plain `pip install -r requirements.txt` fails immediately with
        # ModuleNotFoundError: No module named 'numpy'. Same bug already
        # fixed in docker/Dockerfile.agent; --no-build-isolation lets pkuseg
        # see the numpy just installed instead of an empty isolated env.
        run: |
          pip install numpy
          pip install --no-build-isolation pkuseg==0.0.25
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Test
        # tests/integration/test_langgraph_flow.py is a standalone script (no
        # pytest-discoverable test_* functions, needs live Postgres/Redis) -
        # pytest correctly finds 0 collectible tests today and exits 5. Treat
        # only that specific "no tests collected" exit code as non-fatal; a
        # real failure (exit 1) still fails the build once real tests exist.
        run: pytest tests/unit tests/integration -v || [ $? -eq 5 ]
