name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Test
        # tests/integration/test_langgraph_flow.py is a standalone script (no
        # pytest-discoverable test_* functions, needs live Postgres/Redis) -
        # pytest correctly finds 0 collectible tests today and exits 5. Treat
        # only that specific "no tests collected" exit code as non-fatal; a
        # real failure (exit 1) still fails the build once real tests exist.
        run: pytest tests/unit tests/integration -v || [ $? -eq 5 ]
