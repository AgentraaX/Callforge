# Alembic config for the CRM store.
#
# The database URL is NOT set here -- env.py reads it from
# app.config.settings.db_sync_url (i.e. your DATABASE_URL), so migrations and
# the app always target the same database.
#
# Usage:
#   alembic revision --autogenerate -m "init crm"   # first time, against Postgres
#   alembic upgrade head
#   alembic downgrade base

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
